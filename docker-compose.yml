services:
  homeassistant:
    image: homeassistant/home-assistant:latest
    container_name: ha-dev
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./homeassistant_config:/config
      - ./custom_components/eurotronic_comet_wifi:/config/custom_components/eurotronic_comet_wifi:ro
      - /etc/localtime:/etc/localtime:ro
